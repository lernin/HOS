<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Concept Interactions · The Lab</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#f5f0e6;color:#173c31;font:17px system-ui}*{box-sizing:border-box}button{border:1px solid #9eaea4;background:#fffaf0;color:#173c31;border-radius:12px;font-weight:800;font-size:16px}main{height:100dvh;padding:8px;display:grid;grid-template-rows:42px 48px 1fr 52px;gap:7px}header,footer{display:flex;align-items:center;justify-content:space-between}header b{font-size:22px}header span{font-size:18px;font-weight:700}header button{padding:7px 12px}nav{display:flex;justify-content:center;gap:6px}nav button{min-width:48px;padding:8px 10px}nav button.on,.ashley button.on{background:#173c31;color:#fff}.card{min-height:0;border:1px solid #bbb5a9;background:#fffdf8;border-radius:20px;padding:12px 14px;display:grid;grid-template-rows:auto auto auto auto 92px auto;gap:7px;overflow:hidden}.title{display:flex;justify-content:space-between;align-items:center}.title b{font-size:36px;line-height:1}.title span{font-size:24px;font-weight:900}.flow{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;text-align:center;background:#f6f2e8;border-radius:15px;padding:7px 6px}.side{display:grid;gap:2px}.side small,.label,.ashley small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}.side b{font-size:30px;line-height:1}.side span{font-size:15px;font-weight:650}.side em{font-size:14px;line-height:1.18;font-style:normal;opacity:.8}.arrow{font-size:24px}.tech{font-size:15px;line-height:1.2;text-align:center;margin:0;font-weight:600}.exchange{display:grid;grid-template-columns:1fr 28px 1fr;gap:6px;align-items:stretch}.role{border:1px solid #d8d0c2;border-radius:13px;padding:8px;background:#fff}.role .who{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}.role b{display:block;font-size:18px;line-height:1.2;margin:3px 0}.role p{font-size:15px;line-height:1.2;margin:3px 0}.role .act{font-weight:800}.exchange .arrow{display:grid;place-items:center}.prompt{border-top:1px solid #d8d0c2;padding-top:5px}.prompt b{display:block;font-size:17px;line-height:1.25;margin-top:2px}.pre{font-size:14px;line-height:1.2;opacity:.82}.notearea{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:3px}textarea{width:100%;height:68px;resize:none;border:1px solid #bdb6aa;border-radius:12px;padding:9px;font:17px system-ui;background:white}.actions{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:end}.mic{padding:10px 14px;font-size:18px}.mic.rec{background:#8e2637;color:white}.confidence-stack{display:grid;gap:5px}.ai{display:flex;justify-content:flex-end;align-items:center;gap:7px;font-size:15px}.ai b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8eee9;font-size:19px}.ashley{display:flex;justify-content:flex-end;align-items:center;gap:5px}.ashley button{width:46px;height:42px;padding:0;font-size:20px}footer button{font-size:28px;padding:4px 24px}footer span{font-size:14px;font-weight:650}.gate{height:100dvh;display:grid;place-items:center}.gate form{display:flex;gap:6px}.gate input{width:110px;font-size:22px;padding:8px}@media(max-height:760px){main{padding:5px;grid-template-rows:36px 41px 1fr 44px;gap:4px}.card{padding:8px 10px;gap:4px;grid-template-rows:auto auto auto auto 62px auto}.title b{font-size:30px}.title span{font-size:21px}.flow{padding:4px}.side b{font-size:25px}.side span{font-size:13px}.side em{font-size:12px}.tech{font-size:13px}.role{padding:5px}.role b{font-size:15px}.role p{font-size:12px}.prompt b{font-size:14px}.pre{font-size:12px}textarea{height:45px;font-size:15px}.ashley button{height:35px}.mic{padding:7px 10px}}
</style></head><body><div id="app" class="gate"><form id="gate"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Lab PIN"><button>Open</button></form></div><script>
const URL='https://jzaghifuhinkzzhiojre.supabase.co',KEY='sb_publishable_rQDzA5bYlbzvaTjyo-uTXw_LiiIAddI';let pin='',rows=[],filter='0',idx=0,rec=null,chunks=[],touchX=null;async function rpc(fn,args){const r=await fetch(`${URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error(await r.text());return r.json()}const vis=()=>rows.filter(r=>filter==='all'||(filter==='2+'?r.ashley_confidence>=2:String(r.ashley_confidence)===filter));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let v=vis();idx=Math.max(0,Math.min(idx,v.length-1));let r=v[idx];if(!r){app.innerHTML='<main><header><button onclick="location.href=\'/\'">‹ Lab</button><b>Concept Interactions</b></header><div>No interactions in this filter.</div></main>';return}app.className='';app.innerHTML=`<main><header><button onclick="location.href='/'">‹ Lab</button><b>Concept Interactions</b><span>${idx+1}/${v.length}</span></header><nav>${[['all','All'],['0','0'],['1','1'],['2','2'],['3','3'],['2+','2+']].map(x=>`<button class="${filter===x[0]?'on':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('')}</nav><section class="card" id="card"><div class="title"><b>${esc(r.interaction_code)}</b><span>${esc(r.derived_command)}</span></div><div class="flow"><div class="side"><small>Input</small><b>${esc(r.source_coordinate)}</b><span>${esc(r.source_language||'—')} · ${esc(r.source_mode)}</span></div><div class="arrow">→</div><div class="side"><small>Output</small><b>${esc(r.target_coordinate)}</b><span>${esc(r.target_language||'—')} · ${esc(r.target_mode)}</span></div></div><p class="tech">${esc(r.technical_description)}</p><div class="exchange"><div class="role"><span class="who">Teacher / AI</span><b>${esc(r.teacher_asker_does)}</b><p>${esc(r.teacher_asker_example)}</p></div><div class="arrow">→</div><div class="role"><span class="who">Student</span><b>${esc(r.student_responder_does)}</b><p>${esc(r.expected_response)}</p></div></div><div><div class="prompt"><span class="label">Teacher / AI says</span><b>${esc(r.teacher_natural_prompt)}</b></div><div class="pre"><span class="label">Needs</span> ${esc(r.prerequisites)}</div></div><div class="notearea"><span class="label">Ashley note</span><textarea id="note" placeholder="Optional note — type or use Mic…" onblur="saveNote()">${esc(r.review_note||'')}</textarea></div><div class="actions"><button id="mic" class="mic" onclick="mic()">● Mic</button><div class="confidence-stack"><div class="ai"><span>AI confidence</span><b>${r.ai_confidence??'—'}</b><span>Use ${r.usefulness??'—'} · Diff ${r.difficulty??'—'}</span></div><div class="ashley"><small>Your confidence</small>${[0,1,2,3].map(n=>`<button class="${r.ashley_confidence===n?'on':''}" onclick="confidence(${n})">${n}</button>`).join('')}</div></div></div></section><footer><button onclick="go(-1)">‹</button><span id="msg">${rows.filter(x=>x.ashley_confidence===0).length} unconfirmed · swipe ↔</span><button onclick="go(1)">›</button></footer></main>`;let c=document.getElementById('card');c.ontouchstart=e=>touchX=e.changedTouches[0].clientX;c.ontouchend=e=>{if(touchX===null)return;let d=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(d)>55)go(d<0?1:-1)}}async function load(){rows=await rpc('lab_concept_interaction_read',{pin});render()}function setFilter(f){filter=f;idx=0;render()}function go(d){idx=Math.max(0,Math.min(vis().length-1,idx+d));render()}async function update(c,n,setn){let r=vis()[idx];let out=await rpc('lab_concept_interaction_review',{pin,interaction_id:r.id,new_confidence:c??null,new_note:n??null,set_note:!!setn});rows=rows.map(x=>x.id===r.id?out:x);render()}async function confidence(n){await update(n);go(1)}async function saveNote(){await update(null,document.getElementById('note').value,true)}async function mic(){if(rec){rec.stop();return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:rec.mimeType});rec=null;let fd=new FormData();fd.append('audio',blob,'note.webm');let m=document.getElementById('msg');if(m)m.textContent='Transcribing…';let res=await fetch('/api/transcribe',{method:'POST',headers:{'x-review-pin':pin},body:fd}),o=await res.json();if(!res.ok){if(m)m.textContent=o.error||'Failed';return}let ta=document.getElementById('note');ta.value=[ta.value,o.text].filter(Boolean).join(' ').trim();await saveNote()};rec.start();document.getElementById('mic').classList.add('rec');document.getElementById('mic').textContent='■ Stop'}document.getElementById('gate').onsubmit=async e=>{e.preventDefault();pin=document.getElementById('pin').value.trim();try{await load()}catch(x){alert('Could not open. Check the Lab PIN.')}};
</script></body></html>
