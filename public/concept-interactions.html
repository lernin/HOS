<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Concept Interactions · The Lab</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#f5f0e6;color:#173c31;font:14px system-ui}*{box-sizing:border-box}button{border:1px solid #a8b8ad;background:#fffaf0;color:#173c31;border-radius:10px;font-weight:750}main{height:100dvh;padding:7px;display:grid;grid-template-rows:34px 35px 1fr 38px;gap:5px}header,footer{display:flex;align-items:center;justify-content:space-between}header b{font-size:16px}header button{padding:5px 9px}nav{display:flex;justify-content:center;gap:4px}nav button{min-width:38px;padding:5px 8px}nav button.on,.ashley button.on{background:#173c31;color:#fff}.card{min-height:0;border:1px solid #c9c2b4;background:#fffdf8;border-radius:16px;padding:10px;display:grid;grid-template-rows:auto auto auto auto minmax(54px,1fr) auto;gap:7px;overflow:hidden}.title{display:flex;justify-content:space-between;align-items:baseline}.title b{font-size:30px;line-height:1}.title span{font-size:18px;font-weight:850}.flow{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;text-align:center;background:#f8f5ed;border-radius:12px;padding:7px 4px}.side{display:grid;gap:1px}.side small,.label,.ashley small{font-size:9px;letter-spacing:.09em;text-transform:uppercase;opacity:.6}.side b{font-size:24px;line-height:1}.side span{font-size:11px}.side em{font-size:10px;font-style:normal;opacity:.72}.tech{font-size:11px;text-align:center;margin:0;opacity:.8}.details{display:grid;grid-template-columns:1fr 1fr;gap:6px}.box{border-top:1px solid #ddd4c6;padding-top:4px;font-size:11px;line-height:1.25}.box.wide{grid-column:1/-1}.box b{display:block;font-size:12px;margin-top:1px}.scores{display:grid;grid-template-columns:auto auto 1fr;gap:6px;font-size:11px;align-items:start}.scores span{background:#f8f5ed;border-radius:8px;padding:5px}.scores b{font-size:13px}.notearea{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:3px}textarea{width:100%;height:100%;min-height:38px;resize:none;border:1px solid #c9c2b4;border-radius:9px;padding:7px;font:13px system-ui;background:white}.actions{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:end}.mic{padding:8px 11px}.mic.rec{background:#8e2637;color:white}.confidence-stack{display:grid;gap:3px}.ai{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:10px}.ai b{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e8eee9;font-size:13px}.ashley{display:flex;justify-content:flex-end;align-items:center;gap:3px}.ashley button{width:35px;height:32px;padding:0;font-size:15px}footer button{font-size:21px;padding:2px 20px}footer span{font-size:11px}.gate{height:100dvh;display:grid;place-items:center}.gate form{display:flex;gap:6px}.gate input{width:100px;font-size:22px;padding:8px}.hint{font-size:9px;opacity:.55;text-align:center}@media(max-height:720px){main{padding:4px;grid-template-rows:30px 31px 1fr 33px}.card{padding:7px;gap:4px}.title b{font-size:25px}.flow{padding:4px}.side b{font-size:20px}.details{gap:3px}.box{font-size:10px}.notearea{min-height:34px}.ashley button{height:28px}.mic{padding:6px 9px}}
</style></head><body><div id="app" class="gate"><form id="gate"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Lab PIN"><button>Open</button></form></div><script>
const URL='https://jzaghifuhinkzzhiojre.supabase.co',KEY='sb_publishable_rQDzA5bYlbzvaTjyo-uTXw_LiiIAddI';let pin='',rows=[],filter='0',idx=0,rec=null,chunks=[],touchX=null;
async function rpc(fn,args){const r=await fetch(`${URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error(await r.text());return r.json()}
const vis=()=>rows.filter(r=>filter==='all'||(filter==='2+'?r.ashley_confidence>=2:String(r.ashley_confidence)===filter));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let v=vis();idx=Math.max(0,Math.min(idx,v.length-1));let r=v[idx];if(!r){app.innerHTML='<main><header><button onclick="location.href=\'/\'">‹ Lab</button><b>Concept Interactions</b></header><div>No interactions in this filter.</div></main>';return}app.className='';app.innerHTML=`<main><header><button onclick="location.href='/'">‹ Lab</button><b>Concept Interactions</b><span>${idx+1}/${v.length}</span></header><nav>${[['all','All'],['0','0'],['1','1'],['2','2'],['3','3'],['2+','2+']].map(x=>`<button class="${filter===x[0]?'on':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('')}</nav><section class="card" id="card"><div class="title"><b>${esc(r.interaction_code)}</b><span>${esc(r.derived_command)}</span></div><div class="flow"><div class="side"><small>Source</small><b>${esc(r.source_coordinate)}</b><span>${esc(r.source_language||'—')} · ${esc(r.source_mode)}</span><em>${esc(r.teacher_asker_does)}</em></div><div>→</div><div class="side"><small>Target</small><b>${esc(r.target_coordinate)}</b><span>${esc(r.target_language||'—')} · ${esc(r.target_mode)}</span><em>${esc(r.student_responder_does)}</em></div></div><p class="tech">${esc(r.technical_description)}</p><div class="details"><div class="box"><span class="label">Input example</span><b>${esc(r.teacher_asker_example)}</b></div><div class="box"><span class="label">Expected response</span><b>${esc(r.expected_response)}</b></div><div class="box wide"><span class="label">Natural prompt</span><b>${esc(r.teacher_natural_prompt)}</b></div><div class="box wide"><span class="label">Prerequisites</span><b>${esc(r.prerequisites)}</b></div></div><div class="notearea"><span class="label">Ashley note</span><textarea id="note" placeholder="Type or use Mic…" onblur="saveNote()">${esc(r.review_note||'')}</textarea></div><div class="actions"><button id="mic" class="mic" onclick="mic()">● Mic</button><div class="confidence-stack"><div class="ai"><span>AI confidence</span><b>${r.ai_confidence??'—'}</b><span>Use ${r.usefulness??'—'} · Diff ${r.difficulty??'—'}</span></div><div class="ashley"><small>Ashley confidence</small>${[0,1,2,3].map(n=>`<button class="${r.ashley_confidence===n?'on':''}" onclick="confidence(${n})">${n}</button>`).join('')}</div></div></div></section><footer><button onclick="go(-1)">‹</button><span id="msg">${rows.filter(x=>x.ashley_confidence===0).length} unconfirmed · swipe ↔</span><button onclick="go(1)">›</button></footer></main>`;let c=document.getElementById('card');c.ontouchstart=e=>touchX=e.changedTouches[0].clientX;c.ontouchend=e=>{if(touchX===null)return;let d=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(d)>55)go(d<0?1:-1)}}
async function load(){rows=await rpc('lab_concept_interaction_read',{pin});render()}function setFilter(f){filter=f;idx=0;render()}function go(d){idx=Math.max(0,Math.min(vis().length-1,idx+d));render()}async function update(c,n,setn){let r=vis()[idx];let out=await rpc('lab_concept_interaction_review',{pin,interaction_id:r.id,new_confidence:c??null,new_note:n??null,set_note:!!setn});rows=rows.map(x=>x.id===r.id?out:x);render()}async function confidence(n){await update(n);go(1)}async function saveNote(){await update(null,document.getElementById('note').value,true)}
async function mic(){if(rec){rec.stop();return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:rec.mimeType});rec=null;let fd=new FormData();fd.append('audio',blob,'note.webm');let m=document.getElementById('msg');if(m)m.textContent='Transcribing…';let res=await fetch('/api/transcribe',{method:'POST',headers:{'x-review-pin':pin},body:fd}),o=await res.json();if(!res.ok){if(m)m.textContent=o.error||'Failed';return}let ta=document.getElementById('note');ta.value=[ta.value,o.text].filter(Boolean).join(' ').trim();await saveNote()};rec.start();document.getElementById('mic').classList.add('rec');document.getElementById('mic').textContent='■ Stop'}
document.getElementById('gate').onsubmit=async e=>{e.preventDefault();pin=document.getElementById('pin').value.trim();try{await load()}catch(x){alert('Could not open. Check the Lab PIN.')}};
</script></body></html>
