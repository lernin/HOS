<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Concept Interactions · The Lab</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f5f0e6;color:#173c31;font:14px system-ui}*{box-sizing:border-box}main{height:100dvh;padding:8px;display:grid;grid-template-rows:36px 38px 1fr 42px;gap:5px}header,footer{display:flex;align-items:center;justify-content:space-between}button{border:1px solid #a8b8ad;background:#fffaf0;color:#173c31;border-radius:9px;padding:6px 10px;font-weight:700}nav{display:flex;justify-content:center;gap:4px}nav button.on,.conf button.on{background:#173c31;color:white}.card{min-height:0;overflow:hidden;border:1px solid #c9c2b4;background:#fffdf8;border-radius:15px;padding:9px;display:flex;flex-direction:column;gap:5px}.title{display:flex;justify-content:space-between;align-items:center}.title b{font-size:27px}.title span{font-size:18px;font-weight:800}.flow{display:grid;grid-template-columns:1fr 24px 1fr;text-align:center;align-items:center}.side{display:flex;flex-direction:column}.side small,.ex small,.conf small{font-size:9px;letter-spacing:.08em;opacity:.6}.side b{font-size:22px}.side span,.side em{font-size:11px}.side em{font-style:normal;opacity:.7}.tech{text-align:center;margin:0;font-size:12px}.ex{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}.ex>span{border-top:1px solid #ddd4c6;padding-top:3px;font-size:10px;display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;gap:4px;font-size:10px}textarea{width:100%;min-height:40px;max-height:50px;resize:none;border:1px solid #c9c2b4;border-radius:8px;padding:6px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:auto}.conf{display:flex;align-items:center;gap:3px}.rec{background:#8e2637;color:white}footer button{font-size:22px;padding:2px 18px}footer span{font-size:11px}.gate{height:100dvh;display:grid;place-items:center}.gate form{display:flex;gap:6px}.gate input{width:100px;font-size:22px;padding:8px}@media(max-height:700px){main{padding:5px;grid-template-rows:31px 32px 1fr 35px}.card{padding:6px;gap:3px}.title b{font-size:22px}.side b{font-size:18px}textarea{min-height:32px;max-height:36px}button{padding:4px 7px}}</style></head><body><div id="app" class="gate"><form id="gate"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Lab PIN"><button>Open</button></form></div><script>
const URL='https://jzaghifuhinkzzhiojre.supabase.co',KEY='sb_publishable_rQDzA5bYlbzvaTjyo-uTXw_LiiIAddI';let pin='',rows=[],filter='0',idx=0,rec=null,chunks=[];const order=['C','1S','1R','1P','2S','2R','2P'];
async function rpc(fn,args){const r=await fetch(`${URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error(await r.text());return r.json()}
const vis=()=>rows.filter(r=>filter==='all'||filter==='2+'?filter==='all'||r.ashley_confidence>=2:String(r.ashley_confidence)===filter);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let v=vis();idx=Math.max(0,Math.min(idx,v.length-1));let r=v[idx];if(!r){app.innerHTML='<main><header><button onclick="location.href=\'/\'">‹ Lab</button><b>Concept Interactions</b></header><div>No interactions in this filter.</div></main>';return}app.className='';app.innerHTML=`<main><header><button onclick="location.href='/'">‹ Lab</button><b>Concept Interactions</b><span>${idx+1}/${v.length}</span></header><nav>${[['all','All'],['0','0'],['1','1'],['2','2'],['3','3'],['2+','2+']].map(x=>`<button class="${filter===x[0]?'on':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('')}</nav><section class="card"><div class="title"><b>${esc(r.interaction_code)}</b><span>${esc(r.derived_command)}</span></div><div class="flow"><div class="side"><small>SOURCE</small><b>${esc(r.source_coordinate)}</b><span>${esc(r.source_language||'—')} · ${esc(r.source_mode)}</span><em>Asker ${esc(r.teacher_asker_does)}</em></div><div>—</div><div class="side"><small>TARGET</small><b>${esc(r.target_coordinate)}</b><span>${esc(r.target_language||'—')} · ${esc(r.target_mode)}</span><em>Responder ${esc(r.student_responder_does)}</em></div></div><p class="tech">${esc(r.technical_description)}</p><div class="ex"><span><small>ASKER EXAMPLE</small>${esc(r.teacher_asker_example||'Not proposed yet')}</span><span><small>NATURAL PROMPT</small>${esc(r.teacher_natural_prompt||'Not proposed yet')}</span><span><small>EXPECTED</small>${esc(r.expected_response||'Not proposed yet')}</span></div><div class="meta"><span>Usefulness <b>${r.usefulness??'—'}</b></span><span>Difficulty <b>${r.difficulty??'—'}</b></span><span>Prerequisites <b>${esc(r.prerequisites||'TBD')}</b></span></div><textarea id="note" placeholder="Ashley note…" onblur="saveNote()">${esc(r.review_note||'')}</textarea><div class="actions"><button id="mic" onclick="mic()">● Mic</button><div class="conf"><small>ASHLEY CONFIDENCE</small>${[0,1,2,3].map(n=>`<button class="${r.ashley_confidence===n?'on':''}" onclick="confidence(${n})">${n}</button>`).join('')}</div></div></section><footer><button onclick="go(-1)">‹</button><span id="msg">${rows.filter(x=>x.ashley_confidence===0).length} unconfirmed</span><button onclick="go(1)">›</button></footer></main>`}
async function load(){rows=await rpc('lab_concept_interaction_read',{pin});render()}function setFilter(f){filter=f;idx=0;render()}function go(d){idx=Math.max(0,Math.min(vis().length-1,idx+d));render()}async function update(c,n,setn){let r=vis()[idx];let out=await rpc('lab_concept_interaction_review',{pin,interaction_id:r.id,new_confidence:c??null,new_note:n??null,set_note:!!setn});rows=rows.map(x=>x.id===r.id?out:x);render()}async function confidence(n){await update(n);go(1)}async function saveNote(){await update(null,document.getElementById('note').value,true)}
async function mic(){if(rec){rec.stop();return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:rec.mimeType});rec=null;let fd=new FormData();fd.append('audio',blob,'note.webm');let m=document.getElementById('msg');if(m)m.textContent='Transcribing…';let res=await fetch('/api/transcribe',{method:'POST',headers:{'x-review-pin':pin},body:fd}),o=await res.json();if(!res.ok){if(m)m.textContent=o.error||'Failed';return}let ta=document.getElementById('note');ta.value=[ta.value,o.text].filter(Boolean).join(' ').trim();await saveNote()};rec.start();document.getElementById('mic').classList.add('rec');document.getElementById('mic').textContent='■ Stop'}
document.getElementById('gate').onsubmit=async e=>{e.preventDefault();pin=document.getElementById('pin').value.trim();try{await load()}catch(x){alert('Could not open. Check the Lab PIN.')}};
</script></body></html>
