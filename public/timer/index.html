<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110c" />
  <title>Timer · The Lab</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #07110c;
      color: #d7e6da;
      font: 16px/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    svg {
      width: min(86vw, 320px);
      height: auto;
      display: block;
      background: none;
      border: 0;
      outline: none;
      box-shadow: none;
      filter: none;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    svg, svg * {
      border: 0;
      outline: none;
      box-shadow: none;
      filter: none;
      animation: none !important;
    }
    /* The card fill is the path. Nothing else may draw a ring. */
    svg rect, svg path {
      vector-effect: none;
    }
    p {
      margin: 0;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <svg id="timer" viewBox="0 0 280 184" role="button" aria-label="Timer. Tap to start one counter-clockwise loop from 12."></svg>
  <p>Tap the card</p>
  <script type="module">
    import { mountTimer } from './timer.js'
    const svg = document.getElementById('timer')
    const timer = mountTimer(svg)
    window.__timer = timer
  </script>
</body>
</html>
