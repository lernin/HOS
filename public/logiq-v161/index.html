catch(_e) { return text; }\n  }\n  async function saveCurrentMap(){\n    if (!state.root) { showToast(\"Nothing to save\"); return; }\n    const now=new Date();\n    const fallbackName = currentMapName || `Tree ${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;\n    const name = (prompt(currentMapId ? \"Save changes as:\" : \"Save tree as:\", fallbackName) || fallbackName).trim();\n    if (!name) return;\n    const localSnapshot = { name, data: utils.deepClone(state.root.data), wordBank:[...(state.wordBank || [])], savedAt:new Date().toISOString() };\n    try {\n      const savedId = await logiqRpc('logiq_map_save', {map_name:name,map_tree:localSnapshot.data,map_word_bank:localSnapshot.wordBank,map_id:currentMapId});\n      currentMapId = savedId; currentMapName = name;\n      showToast(`Saved “${name}”`, 1400);\n    } catch(err) {\n      const local = getSavedMaps(); local.push(localSnapshot); setSavedMaps(local);\n      showToast(\"Saved locally — database unavailable\", 1800); console.warn('LOGiQ database save failed', err);\n    }\n  }\n  async function openMapsMenu(){\n    let saved = []; let fromDatabase = true;\n    try { saved = await logiqRpc('logiq_map_list') || []; }\n    catch(err) { fromDatabase = false; saved = getSavedMaps().map((m,i)=>({id:null,name:m.name || `Local ${i+1}`,tree:m.data,word_bank:m.wordBank || [],updated_at:m.savedAt || null})); console.warn('LOGiQ database list failed', err); }\n    if (!saved.length) { alert(\"No saved trees yet. Tap Save to create one.\"); return; }\n    const list = saved.map((m,i)=> `${i+1}. ${m.name}${m.updated_at ? ` — ${new Date(m.updated_at).toLocaleString()}` : ''}`).join(\"\\n\");\n    const input = prompt(`${fromDatabase ? 'Saved Trees' : 'Local saved trees'}\\n\\nChoose a number to open:\\n${list}\\n\\nOr type: del <n>`, \"1\");\n    if (!input) return;\n    const choice = input.trim().toLowerCase();\n    if (choice.startsWith(\"del\")) {\n      const n=parseInt(choice.split(/\\s+/)[1],10); if (!(Number.isFinite(n)&&n>=1&&n<=saved.length)) return;\n      const rec=saved[n-1]; if (!confirm(`Delete “${rec.name}”?`)) return;\n      if (fromDatabase && rec.id) { try { await logiqRpc('logiq_map_delete',{map_id:rec.id}); } catch(err){ alert('Could not delete from database.'); console.warn(err); return; } }\n      else { const local=getSavedMaps(); local.splice(n-1,1); setSavedMaps(local); }\n      if (currentMapId && rec.id===currentMapId){ currentMapId=null; currentMapName=null; } showToast(\"Deleted\",900); return;\n    }\n    const idx=parseInt(choice,10)-1; if (!Number.isFinite(idx)||!saved[idx]) return;\n    const rec=saved[idx], treeData=rec.tree || rec.data; if (!treeData) return;\n    state.root=d3.hierarchy(utils.deepClone(treeData)); utils.assignIds(state.root); state.wordBank=Array.isArray(rec.word_bank)?[...rec.word_bank]:[];\n    currentMapId=rec.id||null; currentMapName=rec.name||null; setSelected(null); renderWordBank?.(); treeManager.layoutAndRender(false); treeManager.autoFit(); showToast(`Loaded “${rec.name}”`,1200);\n  }\n  /* [patch] saved-maps end */");

(async()=>{try{if(!window.pako)throw new Error('pako decompressor did not load');const names=Array.from({length:7},(_,i)=>`./parts/part-${String(i+1).padStart(3,'0')}.b64`);const texts=await Promise.all(names.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u} failed: ${r.status}`);return(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'')}));const b64=texts.join('');if(b64.length!==78920)throw new Error(`payload length ${b64.length}, expected 78920`);const bin=atob(b64),gz=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)gz[i]=bin.charCodeAt(i);const html=patchLogiq(pako.ungzip(gz,{to:'string'}));document.open();document.write(html);document.close()}catch(err){document.getElementById('boot').innerHTML='<div class="card"><h2>LOGiQ v161 could not open</h2><div class="err"></div></div>';document.querySelector('.err').textContent=String(err&&(err.stack||err.message)||err)}})();
