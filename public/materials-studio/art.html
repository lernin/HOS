<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111513" />
<title>Art Studio · The Lab</title>
<style>
:root{--ink:#f6f2e9;--muted:#aeb5ae;--deep:#111513;--panel:#202623;--line:#39413e;--cream:#f0e8d9;--accent:#d8be94}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--deep);color:var(--ink)}button{font:inherit}.app{max-width:1080px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:12px;padding:14px 14px 10px;position:sticky;top:0;z-index:40;background:linear-gradient(#111513 78%,rgba(17,21,19,.88));backdrop-filter:blur(12px)}.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#202623;color:#fff;font-size:21px}.title small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:#9ba39d;font-weight:800}.title h1{margin:1px 0 0;font:500 27px Georgia,serif}.count{margin-left:auto;color:#aeb5ae;font-size:12px;font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:5px 12px 10px;background:#111513;position:sticky;top:64px;z-index:39}.tab{border:1px solid var(--line);border-radius:12px;padding:10px 7px;background:#1c211f;color:#aeb5ae;font-weight:800}.tab.active{background:var(--cream);color:#1a211e;border-color:var(--cream)}
.category-row{display:flex;gap:7px;overflow:auto;padding:2px 12px 12px;background:#111513;scrollbar-width:none}.category-row::-webkit-scrollbar{display:none}.category{flex:0 0 auto;border:1px solid #38403d;background:#1d2320;color:#aeb6b0;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.category.active{background:#4a3f32;color:#fff0d7;border-color:#6b5945}.category.loved{background:#482c33;color:#f1cbd1;border-color:#70404a}
.intro{padding:4px 14px 14px;color:#aeb5ae;font-size:13px;line-height:1.45}.intro strong{color:#efe4d1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0 10px 24px}.card{position:relative;border:1px solid #343c38;background:#1b201e;border-radius:15px;overflow:hidden;text-align:left;color:var(--ink);padding:0;min-width:0}.card.active{border-color:#d8be94;box-shadow:0 0 0 1px #d8be94 inset}.art-wrap{aspect-ratio:4/5;background:#0e110f;padding:8px}.art-wrap canvas{display:block;width:100%;height:100%;background:#eee5d7;box-shadow:0 8px 24px rgba(0,0,0,.3)}.card-copy{padding:10px 11px 12px}.card-copy strong{display:block;font:500 17px/1.08 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-copy span{display:block;color:#929b95;font-size:10px;margin-top:5px;text-transform:uppercase;letter-spacing:.09em}.heart{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,11,.63);color:white;font-size:21px;display:grid;place-items:center;z-index:2;backdrop-filter:blur(6px)}.heart.on{background:#743944;border-color:#a75b68}
.detail{position:fixed;inset:0;display:none;z-index:100;background:rgba(7,9,8,.88);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));align-items:center;justify-content:center}.detail.open{display:flex}.sheet{width:min(760px,100%);max-height:100%;overflow:auto;border:1px solid #39413e;background:#171b19;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.detail-art{background:#101311;padding:14px;display:grid;place-items:center}.detail-art canvas{display:block;width:min(100%,540px);height:auto;aspect-ratio:4/5;background:#eee5d7;box-shadow:0 18px 46px rgba(0,0,0,.42)}.detail-copy{padding:18px}.detail-head{display:flex;gap:10px;align-items:flex-start}.detail-head h2{font:500 31px/1 Georgia,serif;margin:0}.close{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid #3d4742;background:#222826;color:#fff;font-size:20px}.detail-copy p{color:#aeb5ae;line-height:1.45;margin:9px 0 16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{border:1px solid #48514c;border-radius:13px;padding:12px;background:#242a27;color:#f5f0e7;font-weight:900}.action.primary{background:#e8dfd0;color:#1b211e;border-color:#e8dfd0}.action.loved{background:#6d3038;border-color:#8f4b54;color:#fff}.current{margin-top:11px;color:#9ba49e;font-size:11px;text-align:center}.current strong{color:#e9d8bb}.footer{text-align:center;color:#727b75;font-size:11px;padding:0 12px 24px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 14px 32px}.intro{font-size:14px}.art-wrap{padding:10px}}
</style>
</head>
<body>
<div class="app" id="art-app">
<header class="top"><button class="back" onclick="location.href='/materials-studio/viewer'" aria-label="Back to materials">←</button><div class="title"><small>The Lab · Ocean Estate</small><h1>Art Studio</h1></div><div class="count" id="count">50 works</div></header>
<nav class="tabs"><button class="tab" onclick="location.href='/materials-studio/viewer'">Materials</button><button class="tab" onclick="location.href='/materials-studio/viewer#details'">Details</button><button class="tab" onclick="location.href='/materials-studio/viewer#rooms'">Rooms</button><button class="tab active">Art</button></nav>
<div class="category-row" id="categories"></div>
<div class="intro"><strong>50 original curated works</strong> for a warm modern coastal home. Heart the ones you like; Ocean Estate will use up to three favorites on its walls after reload.</div>
<main class="grid" id="grid"></main>
<div class="footer">Art Studio v0.1 · original procedural artwork · no external image licensing dependency</div>
</div>
<div class="detail" id="detail"><div class="sheet"><div class="detail-art"><canvas id="hero" width="800" height="1000"></canvas></div><div class="detail-copy"><div class="detail-head"><div><div id="detailStyle" style="color:#c9ad82;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:900"></div><h2 id="detailName"></h2></div><button class="close" id="close" aria-label="Close">×</button></div><p id="detailNote"></p><div class="actions"><button class="action" id="favorite">♡ Favorite</button><button class="action primary" id="useEstate">Use in Ocean Estate</button></div><div class="current" id="current"></div></div></div></div>
<script>
(() => {
const FAVORITES='materials-studio-art-favorites-v1',ACTIVE='ocean-estate-active-art-v1';
const palettes=[
['#e9dfcf','#baa98e','#5c6b63','#26352f','#9b6b54'],['#efe8dc','#d5c2a7','#7697a0','#315a67','#1d3338'],['#ece7dc','#c8b8a1','#8c8172','#4f4a43','#171b18'],['#f0e6d7','#d8a980','#9a6852','#53645c','#24332d'],['#e8e2d9','#b7c4b2','#6f856f','#425343','#1d2922'],['#eee7dd','#cfc5bb','#a3a8aa','#5e676a','#252b2d'],['#eee0cc','#d6b78c','#a77f59','#6c5142','#332d29'],['#e8e7e1','#cbcdd0','#8c96a2','#465260','#202731'],['#f0e9df','#d9c6bb','#b88982','#725b5b','#382f33'],['#e9e0d2','#c6b391','#8d785e','#5b5f51','#27312b']];
const styles=['Color field','Coastal','Ink study','Geometry','Horizon','Organic','Line work','Monolith','Veil','Night'];
const titles=['Still Water','Quiet Current','Salt Air','Morning Stone','Open Tide','Drift No. 1','Atlantic Light','Pale Horizon','Blue Silence','Low Water','Sumi Coast','Black Reed','Soft Gesture','Ink Weather','Distant Branch','Measured Calm','Sand Geometry','Terrace Study','Balanced Shore','House of Light','First Horizon','Dawn Line','Amber Distance','After Rain','Edge of Sea','Wild Olive','Coastal Bloom','Dry Garden','Seed and Stone','Green Passage','Single Line','Conversation','Long Arc','Two Figures','Continuum','Stone Portal','Bronze Quiet','Soft Monolith','Threshold','Weight and Air','Linen Veil','Warm Mist','Folded Light','Quiet Curtain','Pearl Atmosphere','Night Coast','Moon Water','Indigo Room','Nocturne Bay','Last Light'];
const notes={
'Color field':'Large quiet fields of warm mineral color designed to hold a room without dominating it.','Coastal':'Abstracted sea, sky and shoreline tones rather than literal beach imagery.','Ink study':'Restrained gestural marks with generous negative space.','Geometry':'Architectural forms, balanced proportions and softened modernist structure.','Horizon':'Low, calm compositions that extend the ocean-facing architecture.','Organic':'Botanical and stone-like forms reduced to elegant silhouettes.','Line work':'Minimal drawn movement for quieter bedrooms, halls and library walls.','Monolith':'Sculptural mass translated into flat image-making instead of physical objects.','Veil':'Layered translucent shapes with linen, plaster and soft-light character.','Night':'Deep indigo and charcoal works for rooms that benefit from subtle drama.'};
const arts=titles.map((name,i)=>({id:`estate-art-${String(i+1).padStart(2,'0')}`,name,style:styles[i%styles.length],palette:palettes[(i*3+Math.floor(i/10))%palettes.length],seed:137+i*97}));
let filter='All',selected=arts[0];
const readFavs=()=>{try{return JSON.parse(localStorage.getItem(FAVORITES)||'[]')}catch{return []}},writeFavs=v=>localStorage.setItem(FAVORITES,JSON.stringify(v));
const active=()=>{try{return JSON.parse(localStorage.getItem(ACTIVE)||'null')}catch{return null}};
function rng(seed){let s=seed>>>0;return()=>((s=Math.imul(1664525,s)+1013904223>>>0)/4294967296)}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function renderArt(canvas,art){const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,r=rng(art.seed),p=art.palette;ctx.clearRect(0,0,w,h);ctx.fillStyle=p[0];ctx.fillRect(0,0,w,h);
  const grain=ctx.createImageData(w,h);for(let i=0;i<grain.data.length;i+=4){const n=Math.floor(r()*14);grain.data[i]=grain.data[i+1]=grain.data[i+2]=n;grain.data[i+3]=12}ctx.putImageData(grain,0,0);ctx.globalCompositeOperation='source-over';
  if(art.style==='Color field'){for(let i=0;i<5;i++){ctx.globalAlpha=.6+r()*.18;ctx.fillStyle=p[1+i%4];const x=-w*.15+r()*w*.75,y=-h*.08+r()*h*.8,ww=w*(.45+r()*.65),hh=h*(.18+r()*.38);rounded(ctx,x,y,ww,hh,80+r()*100)}}
  else if(art.style==='Coastal'){const bands=[p[0],p[2],p[3],p[1]];let y=0;for(let i=0;i<4;i++){const hh=h*[.42,.22,.12,.3][i];ctx.fillStyle=bands[i];ctx.globalAlpha=i===1?.82:1;ctx.beginPath();ctx.moveTo(0,y);for(let x=0;x<=w;x+=40)ctx.lineTo(x,y+Math.sin(x*.012+i+r())*(12+i*5));ctx.lineTo(w,y+hh);ctx.lineTo(0,y+hh);ctx.closePath();ctx.fill();y+=hh*.85}ctx.globalAlpha=.28;ctx.fillStyle='#fff';ctx.fillRect(0,h*.48,w,3)}
  else if(art.style==='Ink study'){ctx.strokeStyle=p[4];ctx.lineCap='round';for(let j=0;j<5;j++){ctx.globalAlpha=.18+j*.11;ctx.lineWidth=8+j*7;ctx.beginPath();let x=w*(.18+r()*.15),y=h*(.18+r()*.65);ctx.moveTo(x,y);for(let i=0;i<7;i++){x+=w*(.08+r()*.1);y+=h*(-.08+r()*.16);ctx.quadraticCurveTo(x-w*.04,y+h*(-.04+r()*.08),x,y)}ctx.stroke()}ctx.globalAlpha=.12;ctx.fillStyle=p[2];ctx.arc(w*.7,h*.72,w*.11,0,Math.PI*2);ctx.fill()}
  else if(art.style==='Geometry'){for(let i=0;i<9;i++){ctx.globalAlpha=.36+r()*.35;ctx.fillStyle=p[1+i%4];const ww=w*(.12+r()*.3),hh=h*(.08+r()*.28),x=r()*(w-ww),y=r()*(h-hh);if(i%3===0){ctx.save();ctx.translate(x+ww/2,y+hh/2);ctx.rotate((r()-.5)*.6);rounded(ctx,-ww/2,-hh/2,ww,hh,10);ctx.restore()}else rounded(ctx,x,y,ww,hh,10)}}
  else if(art.style==='Horizon'){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(.56,p[3]);g.addColorStop(1,p[2]);ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.65;ctx.fillStyle=p[4];ctx.fillRect(0,h*(.55+r()*.08),w,4);ctx.globalAlpha=.34;ctx.beginPath();ctx.ellipse(w*(.2+r()*.6),h*.35,45,45,0,0,Math.PI*2);ctx.fill()}
  else if(art.style==='Organic'){for(let i=0;i<11;i++){ctx.globalAlpha=.18+r()*.33;ctx.fillStyle=p[1+i%4];ctx.beginPath();const x=w*(.12+r()*.76),y=h*(.1+r()*.8),rx=w*(.04+r()*.13),ry=h*(.04+r()*.12);ctx.ellipse(x,y,rx,ry,(r()-.5)*2,0,Math.PI*2);ctx.fill()}ctx.strokeStyle=p[4];ctx.globalAlpha=.28;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.18,h*.84);ctx.bezierCurveTo(w*.4,h*.7,w*.35,h*.3,w*.7,h*.14);ctx.stroke()}
  else if(art.style==='Line work'){ctx.strokeStyle=p[4];ctx.lineWidth=3.5;ctx.globalAlpha=.72;for(let j=0;j<4;j++){ctx.beginPath();let x=w*(.15+r()*.2),y=h*(.15+r()*.7);ctx.moveTo(x,y);for(let i=0;i<12;i++){x+=w*(.035+r()*.055);y+=h*(-.055+r()*.11);ctx.lineTo(x,y)}ctx.stroke()}ctx.globalAlpha=.18;ctx.fillStyle=p[2];ctx.fillRect(w*.12,h*.73,w*.72,h*.025)}
  else if(art.style==='Monolith'){ctx.globalAlpha=.9;ctx.fillStyle=p[4];const x=w*(.18+r()*.18),y=h*(.16+r()*.17),ww=w*(.38+r()*.22),hh=h*(.46+r()*.24);rounded(ctx,x,y,ww,hh,18+r()*50);ctx.globalAlpha=.5;ctx.fillStyle=p[2];rounded(ctx,x+ww*.12,y+hh*.1,ww*.18,hh*.82,20);ctx.globalAlpha=.25;ctx.fillStyle=p[1];ctx.beginPath();ctx.arc(w*.76,h*.26,w*.11,0,Math.PI*2);ctx.fill()}
  else if(art.style==='Veil'){for(let i=0;i<7;i++){ctx.save();ctx.globalAlpha=.13+r()*.2;ctx.fillStyle=p[1+i%4];ctx.translate(w*(.2+r()*.6),h*(.1+r()*.8));ctx.rotate((r()-.5)*1.3);rounded(ctx,-w*.3,-h*.11,w*.6,h*.22,120);ctx.restore()}ctx.globalAlpha=.5;ctx.strokeStyle=p[4];ctx.lineWidth=2;ctx.strokeRect(w*.13,h*.11,w*.74,h*.78)}
  else {ctx.fillStyle=p[4];ctx.globalAlpha=1;ctx.fillRect(0,0,w,h);const g=ctx.createRadialGradient(w*.52,h*.42,10,w*.52,h*.42,w*.48);g.addColorStop(0,p[2]);g.addColorStop(.5,p[3]);g.addColorStop(1,p[4]);ctx.globalAlpha=.72;ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.65;ctx.fillStyle=p[1];ctx.beginPath();ctx.arc(w*(.28+r()*.45),h*(.24+r()*.25),35+r()*30,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.36;ctx.strokeStyle=p[0];ctx.lineWidth=3;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(0,h*(.6+i*.035));ctx.bezierCurveTo(w*.35,h*(.56+i*.04),w*.68,h*(.67+i*.02),w,h*(.61+i*.04));ctx.stroke()}}
  ctx.globalAlpha=.09;ctx.fillStyle='#fff';for(let i=0;i<80;i++)ctx.fillRect(r()*w,r()*h,1+r()*2,1+r()*2);ctx.globalAlpha=1;
}
function isFav(id){return readFavs().some(x=>x.id===id)}
function toggleFav(art){let f=readFavs(),i=f.findIndex(x=>x.id===art.id);if(i>=0)f.splice(i,1);else f.unshift(art);writeFavs(f);renderGrid();updateDetail()}
function setActive(art){localStorage.setItem(ACTIVE,JSON.stringify(art));if(!isFav(art.id)){const f=readFavs();f.unshift(art);writeFavs(f)}renderGrid();updateDetail()}
function filtered(){const favIds=new Set(readFavs().map(x=>x.id));return arts.filter(a=>filter==='All'||filter==='Favorites'?favIds.has(a.id):a.style===filter)}
function renderCategories(){const cats=['All','Favorites',...styles];document.getElementById('categories').innerHTML=cats.map(c=>`<button class="category ${c===filter?'active':''} ${c==='Favorites'?'loved':''}" data-cat="${c}">${c}${c==='Favorites'?` · ${readFavs().length}`:''}</button>`).join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;renderCategories();renderGrid()})}
function renderGrid(){renderCategories();const grid=document.getElementById('grid'),items=filtered(),act=active();document.getElementById('count').textContent=`${items.length} of 50`;grid.innerHTML=items.map(a=>`<button class="card ${act?.id===a.id?'active':''}" data-id="${a.id}"><span class="heart ${isFav(a.id)?'on':''}" data-heart="${a.id}">${isFav(a.id)?'♥':'♡'}</span><div class="art-wrap"><canvas width="320" height="400" data-canvas="${a.id}"></canvas></div><div class="card-copy"><strong>${a.name}</strong><span>${a.style}${act?.id===a.id?' · in estate':''}</span></div></button>`).join('');items.forEach(a=>renderArt(grid.querySelector(`canvas[data-canvas="${a.id}"]`),a));grid.querySelectorAll('.card').forEach(card=>card.onclick=e=>{const a=arts.find(x=>x.id===card.dataset.id);if(!a)return;if(e.target.dataset.heart){e.stopPropagation();toggleFav(a);return}openDetail(a)})}
function openDetail(a){selected=a;renderArt(document.getElementById('hero'),a);document.getElementById('detail').classList.add('open');updateDetail()}
function updateDetail(){document.getElementById('detailName').textContent=selected.name;document.getElementById('detailStyle').textContent=selected.style;document.getElementById('detailNote').textContent=notes[selected.style];const fav=document.getElementById('favorite');fav.textContent=isFav(selected.id)?'♥ Favorited':'♡ Favorite';fav.classList.toggle('loved',isFav(selected.id));const act=active();document.getElementById('useEstate').textContent=act?.id===selected.id?'✓ In Ocean Estate':'Use in Ocean Estate';document.getElementById('current').innerHTML=readFavs().length?`<strong>${readFavs().length} favorite${readFavs().length===1?'':'s'}</strong> · the house uses up to three favorites after reload`:'Pick favorites and the house will replace its old sculptural wall pieces with them.'}
document.getElementById('close').onclick=()=>document.getElementById('detail').classList.remove('open');document.getElementById('detail').onclick=e=>{if(e.target.id==='detail')e.currentTarget.classList.remove('open')};document.getElementById('favorite').onclick=()=>toggleFav(selected);document.getElementById('useEstate').onclick=()=>setActive(selected);renderGrid();
})();
</script>
</body>
</html>
