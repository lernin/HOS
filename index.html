<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020a03" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Lab" />
    <meta name="application-name" content="The Lab" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>The Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/thekonym-information.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch((error) => console.warn('Thekonym service worker registration failed', error));
        });
      }

      // Trash keeps the catalog/database record. This control removes only the
      // currently opened rejected recording from browser Cache Storage.
      if ('caches' in window) {
        const syncTrashAudioControl = () => {
          const trash = document.querySelector('.md-trash.on');
          const existing = document.querySelector('[data-delete-local-audio]');
          if (!trash) {
            existing?.remove();
            return;
          }
          if (existing) return;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'md-trash';
          button.dataset.deleteLocalAudio = 'true';
          button.textContent = 'Delete local audio';
          button.addEventListener('click', async () => {
            const audio = document.querySelector('.music-discovery audio');
            const source = audio?.currentSrc || audio?.src || '';
            if (!source) {
              button.textContent = 'No local audio loaded';
              return;
            }
            let removed = false;
            for (const cacheName of await caches.keys()) {
              const cache = await caches.open(cacheName);
              const requests = await cache.keys();
              for (const request of requests) {
                if (request.url === source) removed = (await cache.delete(request, { ignoreVary: true })) || removed;
              }
            }
            button.textContent = removed ? 'Local audio deleted' : 'No cached audio found';
            button.disabled = true;
          });
          trash.insertAdjacentElement('afterend', button);
        };
        new MutationObserver(syncTrashAudioControl).observe(document.getElementById('root'), { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
        window.addEventListener('load', syncTrashAudioControl);
      }
    </script>
  </body>
</html>
