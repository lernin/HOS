<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020a03" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Lab" />
    <meta name="application-name" content="The Lab" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>The Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-router.ts"></script>
    <script type="module" src="/src/thekonym-information.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch((error) => console.warn('Thekonym service worker registration failed', error));
        });
      }

      // Materials Studio is a standalone, phone-first Lab tool. Keep it visible in the
      // React hub without coupling the static material browser to the main app bundle.
      (() => {
        const addMaterialsStudioCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('materials-studio-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'materials-studio-hub-card';
          card.innerHTML = '<span class="experience-icon">Mt</span><span class="experience-copy"><strong>Materials Studio</strong><small>Explore full-screen CC0 stone, wood, plaster, and surface textures for Ocean Estate.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => { window.location.href = '/materials-studio'; });

          const firstCard = grid.querySelector('.experience-card');
          if (firstCard) firstCard.after(card); else grid.prepend(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addMaterialsStudioCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addMaterialsStudioCard, 0));
        setTimeout(addMaterialsStudioCard, 0);
      })();

      // LOGiQ v161 is the recovered working historical baseline. Keep it standalone so
      // we can improve it safely without rewriting the original interaction engine first.
      (() => {
        const addLogiqCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('logiq-v161-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'logiq-v161-hub-card';
          card.innerHTML = '<span class="experience-icon">Q</span><span class="experience-copy"><strong>LOGiQ v161</strong><small>Recovered working LOGiQ tree workspace. Open the preserved baseline here and improve it from a known-good version.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => { window.location.href = '/logiq-v161/'; });

          const musicCard = Array.from(grid.querySelectorAll('.experience-card')).find(el => el.textContent?.includes('Music Discovery'));
          if (musicCard) musicCard.after(card); else grid.append(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addLogiqCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addLogiqCard, 0));
        setTimeout(addLogiqCard, 0);
      })();

      // Engagement Matrix is intentionally isolated as a fast-moving learning prototype.
      // The card only appears after the normal Lab has been unlocked. A direct visit still
      // asks for the Lab PIN in its dedicated entry point.
      (() => {
        const addEngagementCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('engagement-matrix-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'engagement-matrix-hub-card';
          card.innerHTML = '<span class="experience-icon">EM</span><span class="experience-copy"><strong>Engagement Matrix</strong><small>Try Standalone, Decompose, and Compose across engagement levels 0–15.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => {
            sessionStorage.setItem('engagement-lab-unlocked', '1');
            window.location.href = '/engagement-lab';
          });

          const conceptCard = Array.from(grid.querySelectorAll('.experience-card')).find(el => el.textContent?.includes('Concept Interactions'));
          if (conceptCard) conceptCard.after(card); else grid.append(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addEngagementCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addEngagementCard, 0));
        setTimeout(addEngagementCard, 0);
      })();
    </script>
  </body>
</html>
