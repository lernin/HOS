<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020a03" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Lab" />
    <meta name="application-name" content="The Lab" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>The Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/thekonym-information.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch((error) => console.warn('Thekonym service worker registration failed', error));
        });
      }
      const addConceptInteractionsToHub = () => {
        const grid = document.querySelector('.experience-grid');
        if (!grid || grid.querySelector('[data-concept-interactions]')) return;
        const card = document.createElement('article');
        card.className = 'experience-card';
        card.dataset.conceptInteractions = 'true';
        card.innerHTML = '<span class="experience-icon">CI</span><span class="experience-copy"><strong>Concept Interactions</strong><small>Review the 49 input-output interactions, examples, prompts, confidence, and notes.</small></span><button class="experience-go">Go</button>';
        card.querySelector('button').addEventListener('click', () => { window.location.href = '/concept-interactions.html'; });
        grid.appendChild(card);
      };
      new MutationObserver(addConceptInteractionsToHub).observe(document.getElementById('root'), { childList: true, subtree: true });
      addConceptInteractionsToHub();
    </script>
  </body>
</html>
