<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020a03" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Lab" />
    <meta name="application-name" content="The Lab" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>The Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-router.ts"></script>
    <script type="module" src="/src/thekonym-information.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch((error) => console.warn('Thekonym service worker registration failed', error));
        });
      }

      // Materials Studio is a standalone, phone-first Lab tool. Keep it visible in the
      // React hub without coupling the static material browser to the main app bundle.
      (() => {
        const addMaterialsStudioCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('materials-studio-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'materials-studio-hub-card';
          card.innerHTML = '<span class="experience-icon">Mt</span><span class="experience-copy"><strong>Materials Studio</strong><small>Explore full-screen CC0 stone, wood, plaster, and surface textures for Ocean Estate.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => { window.location.href = '/materials-studio'; });

          const firstCard = grid.querySelector('.experience-card');
          if (firstCard) firstCard.after(card); else grid.prepend(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addMaterialsStudioCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addMaterialsStudioCard, 0));
        setTimeout(addMaterialsStudioCard, 0);
      })();

      // LOGiQ v161 is the recovered working historical baseline. Keep it standalone so
      // we can improve it safely without rewriting the original interaction engine first.
      (() => {
        const addLogiqCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('logiq-v161-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'logiq-v161-hub-card';
          card.innerHTML = '<span class="experience-icon">Q</span><span class="experience-copy"><strong>LOGiQ v161</strong><small>Recovered working LOGiQ tree workspace. Open the preserved baseline here and improve it from a known-good version.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => { window.location.href = '/logiq-v161/'; });

          const musicCard = Array.from(grid.querySelectorAll('.experience-card')).find(el => el.textContent?.includes('Music Discovery'));
          if (musicCard) musicCard.after(card); else grid.append(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addLogiqCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addLogiqCard, 0));
        setTimeout(addLogiqCard, 0);
      })();

      // LOGYQ is the isolated maintainability copy. Sibling Lab card only —
      // do not replace or remove the LOGiQ v161 baseline card above.
      (() => {
        const addLogyqCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('logyq-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'logyq-hub-card';
          card.innerHTML = '<span class="experience-icon">Y</span><span class="experience-copy"><strong>LOGYQ</strong><small>Isolated LOGYQ tree workspace. Experiment here without changing the LOGiQ v161 baseline.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => { window.location.href = '/logyq/'; });

          const logiqCard = document.getElementById('logiq-v161-hub-card');
          if (logiqCard) logiqCard.after(card); else grid.append(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addLogyqCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addLogyqCard, 0));
        setTimeout(addLogyqCard, 0);
      })();

      // Timer is a standalone stroke experiment. Sibling Lab card only.
      (() => {
        const addTimerCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('timer-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'timer-hub-card';
          card.innerHTML = '<span class="experience-icon">T</span><span class="experience-copy"><strong>Timer</strong><small>Tap for red, again for amber, again to turn it off. One counter-clockwise stroke from 12.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => { window.location.href = '/timer/'; });

          const logyqCard = document.getElementById('logyq-hub-card');
          if (logyqCard) logyqCard.after(card); else grid.append(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addTimerCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addTimerCard, 0));
        setTimeout(addTimerCard, 0);
      })();

      // Phonics is a standalone letter-card page. Sibling Lab card only.
      (() => {
        const addPhonicsCard = () => {
          const grid = document.querySelector('.experience-grid');
          if (!grid || document.getElementById('phonics-hub-card')) return;

          const card = document.createElement('article');
          card.className = 'experience-card';
          card.id = 'phonics-hub-card';
          card.innerHTML = '<span class="experience-icon">Ph</span><span class="experience-copy"><strong>Phonics</strong><small>Letter cards for classroom phonics. Swipe to record what each child can do.</small></span><button class="experience-go" type="button">Go</button>';
          card.querySelector('button')?.addEventListener('click', () => { window.location.href = '/phonics-swipe'; });

          const timerCard = document.getElementById('timer-hub-card');
          if (timerCard) timerCard.after(card); else grid.append(card);
        };

        const root = document.getElementById('root');
        if (root) new MutationObserver(addPhonicsCard).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', () => setTimeout(addPhonicsCard, 0));
        setTimeout(addPhonicsCard, 0);
      })();
    </script>
  </body>
</html>
