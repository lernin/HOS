name: LOGiQ preview regression
on:
  push:
    branches:
      - 'preview/logiq-*'
    paths:
      - public/logiq-v161/**
      - public/logiq-v161-legacy/**
      - public/logiq-v162-mobile/**
      - tests/logiq-v161-*
      - tests/logiq-v162-*
      - docs/LOGIQ_V161_LEGACY.md
      - docs/LOGIQ_V161_PREVIEW.md
      - package.json
      - .github/workflows/logiq-v161-preview.yml
  pull_request:
    branches: [main]
    paths:
      - public/logiq-v161/**
      - public/logiq-v161-legacy/**
      - public/logiq-v162-mobile/**
      - tests/logiq-v161-*
      - tests/logiq-v162-*
      - docs/LOGIQ_V161_LEGACY.md
      - docs/LOGIQ_V161_PREVIEW.md
      - package.json
      - .github/workflows/logiq-v161-preview.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:logiq
      - run: npm install --no-save --package-lock=false playwright@1.55.0 d3@7.9.0
      - run: npx playwright install --with-deps chromium
      - name: Run desktop, mobile, offline, and v162 interaction smoke tests
        run: |
          npm run dev -- --port 4173 > /tmp/logiq-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/logiq-v161/index.html >/dev/null; then break; fi
            sleep 1
          done
          grep -Fq '#logiq-spawn-puck.is-visible{display:none!important}' public/logiq-v161/logiq-preview.js
          grep -Fq '#logiq-spawn-ghost.is-visible{display:none!important}' public/logiq-v161/logiq-preview.js
          node --test --test-name-pattern='^(immutable legacy route|desktop preview|mobile preview|landscape phone shell|phone shell survives)' tests/logiq-v161-smoke.test.mjs
          node --test tests/logiq-v162-mobile-smoke.test.mjs
          node --test tests/logiq-v162-safety-smoke.test.mjs
