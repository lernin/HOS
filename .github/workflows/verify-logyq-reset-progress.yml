name: Verify LOGYQ reset progress

on:
  push:
    branches:
      - feat/logyq-reset-progress-20261002

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/logyq-reset-progress-20261002
          fetch-depth: 0
      - run: npm ci
      - run: node --test tests/logyq-game.test.mjs
      - run: npm run test:logyq
      - run: npm run build
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/verify-logyq-reset-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-logyq-reset-progress.yml
          git commit -m "Remove one-shot LOGYQ reset verifier"
          git push origin HEAD:feat/logyq-reset-progress-20261002
