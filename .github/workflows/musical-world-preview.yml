name: Musical World Preview Check

on:
  push:
    branches:
      - preview/woodland-musical-world-v2-20260905
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/woodland.test.mjs
