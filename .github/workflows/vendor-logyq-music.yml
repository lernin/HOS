name: Vendor LOGYQ music asset

on:
  push:
    branches:
      - fix/logyq-solved-next-safe-area-20261002

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logyq-solved-next-safe-area-20261002
      - name: Download CC0 My Street audio
        run: |
          set -euo pipefail
          mkdir -p public/logyq/audio
          curl -L --fail --retry 3 \
            -o public/logyq/audio/my_street.ogg \
            https://raw.githubusercontent.com/zeskysee/we-missed-party/master/sounds/my_street.ogg
          test -s public/logyq/audio/my_street.ogg
          file public/logyq/audio/my_street.ogg
          size=$(stat -c%s public/logyq/audio/my_street.ogg)
          test "$size" -gt 100000
      - name: Point LOGYQ at bundled audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/logyq/js/game-sound.js")
          s = p.read_text()
          old = "https://opengameart.org/sites/default/files/my_street.ogg"
          new = "/logyq/audio/my_street.ogg"
          if old not in s:
              raise SystemExit("expected remote MUSIC_SOURCE not found")
          p.write_text(s.replace(old, new))
          t = Path("tests/logyq-game-shell.test.mjs")
          x = t.read_text()
          x = x.replace(
              "assert.equal(music.source, 'https://opengameart.org/sites/default/files/my_street.ogg')",
              "assert.equal(music.source, '/logyq/audio/my_street.ogg')"
          )
          t.write_text(x)
          Path("public/logyq/audio/README.md").write_text(
              "# LOGYQ music\n\n"
              "`my_street.ogg` is bundled locally for LOGYQ gameplay. "
              "Original track: “My Street” by congusbongus, released under CC0. "
              "Source copy retrieved from the public GitHub repository "
              "`zeskysee/we-missed-party`. No runtime dependency on the source host.\n"
          )
          PY
      - name: Remove one-shot workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/vendor-logyq-music.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logyq/audio public/logyq/js/game-sound.js tests/logyq-game-shell.test.mjs .github/workflows/vendor-logyq-music.yml
          git commit -m "Bundle LOGYQ music locally"
          git push origin HEAD:fix/logyq-solved-next-safe-area-20261002
