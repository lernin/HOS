name: Verify LOGYQ PR 154

on:
  push:
    branches:
      - fix/logyq-solved-next-safe-area-20261002

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logyq-solved-next-safe-area-20261002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:logyq
      - run: npm run build
      - name: Remove one-shot verification workflow
        run: |
          rm .github/workflows/verify-logyq-154.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-logyq-154.yml
          git commit -m "Remove one-shot LOGYQ verification workflow"
          git push origin HEAD:fix/logyq-solved-next-safe-area-20261002
