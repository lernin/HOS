name: Table Viewer Visual Preview

on:
  push:
    branches:
      - feature/table-viewer-20260908
    paths-ignore:
      - 'docs/previews/table-viewer-*.png'
      - 'docs/previews/TABLE_VIEWER_PREVIEW.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: table-viewer-visual-preview
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/table-viewer-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify normal build
        run: npm run build

      - name: Build visual-preview variant
        run: npm run build
        env:
          VITE_TABLE_VIEWER_VISUAL_PREVIEW: '1'

      - name: Install screenshot browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --port 4173 > /tmp/table-viewer-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/table-viewer-preview.log
          exit 1

      - name: Capture phone previews
        run: |
          mkdir -p docs/previews
          npx --yes playwright@1.55.0 screenshot --device="Pixel 5" --full-page --wait-for-timeout=900 "http://127.0.0.1:4173/table-viewer?visual=index" docs/previews/table-viewer-index.png
          npx --yes playwright@1.55.0 screenshot --device="Pixel 5" --full-page --wait-for-timeout=900 "http://127.0.0.1:4173/table-viewer?visual=table" docs/previews/table-viewer-table.png
          npx --yes playwright@1.55.0 screenshot --device="Pixel 5" --full-page --wait-for-timeout=900 "http://127.0.0.1:4173/table-viewer?visual=table&settings=1" docs/previews/table-viewer-settings.png

      - name: Create viewable GitHub preview page
        run: |
          cat > docs/previews/TABLE_VIEWER_PREVIEW.md <<'EOF'
          # Table Viewer — GitHub Actions visual preview

          Generated automatically from `feature/table-viewer-20260908` without a Vercel preview.

          ## Table list

          ![Table list](./table-viewer-index.png)

          ## Open table

          ![Open table](./table-viewer-table.png)

          ## Settings

          ![Settings](./table-viewer-settings.png)
          EOF

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: table-viewer-phone-preview
          path: |
            docs/previews/table-viewer-index.png
            docs/previews/table-viewer-table.png
            docs/previews/table-viewer-settings.png
            docs/previews/TABLE_VIEWER_PREVIEW.md
          retention-days: 14

      - name: Publish preview into the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/table-viewer-index.png docs/previews/table-viewer-table.png docs/previews/table-viewer-settings.png docs/previews/TABLE_VIEWER_PREVIEW.md
          if git diff --cached --quiet; then
            echo "Preview unchanged."
            exit 0
          fi
          git commit -m "chore: refresh Table Viewer GitHub visual preview"
          git pull --rebase origin feature/table-viewer-20260908
          git push origin HEAD:feature/table-viewer-20260908
