name: LOGYQ isolated refactor regression
on:
  push:
    branches:
      - 'refactor/logyq-isolated'
    paths:
      - public/logyq/**
      - api/logyq-maps.ts
      - tests/logyq-*
      - scripts/assemble-logyq.mjs
      - package.json
      - .github/workflows/logyq-isolated.yml
  pull_request:
    branches: [main]
    paths:
      - public/logyq/**
      - api/logyq-maps.ts
      - tests/logyq-*
      - scripts/assemble-logyq.mjs
      - package.json
      - .github/workflows/logyq-isolated.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:logiq
      - run: npm run test:logyq
      - run: npm install --no-save --package-lock=false playwright@1.55.0 d3@7.9.0
      - run: npx playwright install --with-deps chromium
      - name: Run LOGYQ desktop and phone smoke tests
        run: |
          npm run dev -- --port 4173 > /tmp/logyq-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/logyq/index.html >/dev/null; then break; fi
            sleep 1
          done
          npm run test:logyq:smoke
