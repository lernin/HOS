name: Waterfall Village repair CI

on:
  push:
    branches:
      - fix/waterfall-village-cohesion-20260910
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/waterfall-village.test.mjs
