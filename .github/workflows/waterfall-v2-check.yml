name: Waterfall V2 blockout check
on:
  push:
    branches: [experiment/waterfall-v2-blockout-20260912]
    paths:
      - src/experiences/waterfall-v2/**
      - src/experiences/WaterfallVillageV2.tsx
      - src/waterfall-v2-entry.tsx
      - src/entry-router.ts
      - tests/waterfall-v2.test.mjs
      - index.html
      - vercel.json
      - .github/workflows/waterfall-v2-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/waterfall-v2.test.mjs
