name: Music Modality Research

on:
  pull_request:
    branches:
      - main

jobs:
  scan:
    if: github.head_ref == 'research/music-modality-hunt-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/music-modality-scan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: music-modality-scan
          path: artifacts/
