name: Ocean Estate review
on:
  push:
    branches:
      - 'preview/ocean-estate-*'
      - 'release/estate-portrait-20261125'
    paths:
      - src/experiences/estate/**
      - src/experiences/OceanEstate.tsx
      - src/experiences/EstatePlan.tsx
      - src/main.tsx
      - tests/ocean-estate*
      - .github/workflows/ocean-estate-review.yml
  pull_request:
    branches: [main, 'release/ocean-estate-smooth-20261121']
    paths:
      - src/experiences/estate/**
      - src/experiences/OceanEstate.tsx
      - src/experiences/EstatePlan.tsx
      - src/main.tsx
      - tests/ocean-estate*
      - .github/workflows/ocean-estate-review.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/ocean-estate-motion.test.mjs tests/ocean-estate.test.mjs tests/ocean-estate-geometry.test.mjs tests/waterfall-village.test.mjs
      - run: node --experimental-strip-types --test tests/ocean-estate-performance.test.mjs tests/ocean-estate-fast-walk-remote-menu.test.mjs tests/ocean-estate-portrait-mode.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Render estate and verify landscape phone interactions
        run: |
          npm run dev -- --port 4173 > /tmp/ocean-estate-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/tests/ocean-estate-visual.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/ocean-estate-portrait-browser.mjs
          node tests/ocean-estate-remote.mjs
          node tests/ocean-estate-visual.mjs
          node tests/ocean-estate-plan-parity.mjs
          ESTATE_PLAN_TEST_URL=http://127.0.0.1:4173 node tests/ocean-estate-plan-viewport.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-estate-review-${{ github.sha }}
          path: |
            artifacts/ocean-estate/
            artifacts/ocean-estate-parity/
            artifacts/plan-viewport/
