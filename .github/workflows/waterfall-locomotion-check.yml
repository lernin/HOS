name: Waterfall Village locomotion check
on:
  push:
    branches: [fix/waterfall-assisted-locomotion-20260910]
    paths:
      - src/experiences/village/**
      - tests/waterfall-village*.mjs
      - .github/workflows/waterfall-locomotion-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/waterfall-village.test.mjs tests/waterfall-village-locomotion.test.mjs
