name: Build Creekside Village art

on:
  push:
    branches:
      - experiment/medieval-village-20260913
    paths:
      - scripts/build-creekside-kit.py
      - .github/workflows/build-creekside-kit.yml

permissions:
  contents: write

jobs:
  build-art:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/medieval-village-20260913
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - run: python scripts/build-creekside-kit.py
      - name: Commit optimized CC0 art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/village/village-kit-v2-*.part
          git diff --cached --quiet && exit 0
          git commit -m "Build optimized Creekside Village art [skip ci]"
          git push origin HEAD:experiment/medieval-village-20260913
